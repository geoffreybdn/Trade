#   pwa       -> nginx : FreqUI transformée en app installable (PWA)
#   tailscale -> HTTPS privé https://freqtrade.<ton-tailnet>.ts.net (accessible depuis ton téléphone),
#                partage le réseau de nginx : s'il redémarre, il se reconnecte tout seul
#   freqtrade -> le bot, qui parle à Binance. Il a son propre réseau : si l'app tombe, le bot continue de trader.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    restart: unless-stopped
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Les clés Binance et mots de passe sont lus depuis .env (jamais dans config.json)
    env_file: .env
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy EmaRsiStrategy

  pwa:
    image: nginx:1.27-alpine
    container_name: freqtrade-pwa
    restart: unless-stopped
    volumes:
      - ./pwa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pwa/www:/usr/share/nginx/pwa:ro
    # Accès local depuis la machine elle-même : http://127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:80"

  tailscale:
    image: tailscale/tailscale:stable
    container_name: freqtrade-tailscale
    restart: unless-stopped
    network_mode: service:pwa
    depends_on:
      - pwa
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=freqtrade
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
