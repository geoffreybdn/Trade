# Reverse proxy devant FreqUI : ajoute le manifest, les icônes et le service worker
# pour que l'interface s'installe comme une vraie app (PWA) sur le téléphone.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # DNS interne de Docker : « freqtrade » est résolu à chaque requête,
    # nginx démarre même si le bot n'est pas encore prêt
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $freqtrade http://freqtrade:8080;

    location = /manifest.webmanifest {
        root /usr/share/nginx/pwa;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        root /usr/share/nginx/pwa;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location /pwa/ {
        alias /usr/share/nginx/pwa/;
    }

    # Tout le reste (FreqUI + API + websocket) part vers Freqtrade
    location / {
        proxy_pass $freqtrade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        # Injecte les balises PWA dans la page HTML de FreqUI
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#161b1d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Freqtrade"><link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon.png"><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script></head>';
    }
}
